name: Test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
    - uses: actions/checkout@v3
    - uses: asdf-vm/actions/install@v4
    # The CockroachDB test binary is downloaded on a cold runner, inside this timeout.
    - run: go test ./... -timeout 300s
